version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: drawtrack-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-your_secure_password_here}
      POSTGRES_DB: ${DB_NAME:-drawtrack}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - drawtrack-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    image: brambrim/drawtrack-backend:latest
    container_name: drawtrack-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-your_secure_password_here}@postgres:5432/${DB_NAME:-drawtrack}?schema=public
      - JWT_SECRET=${JWT_SECRET:-your_super_secret_jwt_key_change_this}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - drawtrack-network
    volumes:
      - uploads_data:/app/uploads

  # Frontend App
  frontend:
    image: brambrim/drawtrack-frontend:latest
    container_name: drawtrack-frontend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - drawtrack-network

volumes:
  postgres_data:
  uploads_data:

networks:
  drawtrack-network:
    driver: bridge
